server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 200m;

  # Docker's DNS: look the backend up again every 10 s, so a restarted backend (new address) is found
  # without restarting nginx (a fixed name in proxy_pass is resolved only once, at start-up -> 502s).
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_set_header Host $http_host;  # keep the port, so links the API builds (client proposal links) work
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # index.html must never be cached, or browsers keep running an old build after an update.
  # The hashed .js/.css files can be cached for good: a new build gives them new names.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # the field app's service worker: always checked for a new version (Phase L)
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 200m;

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $http_host;  # keep the port, so links the API builds (client proposal links) work
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # index.html must never be cached, or browsers keep running an old build after an update.
  # The hashed .js/.css files can be cached for good: a new build gives them new names.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}

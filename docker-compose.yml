name: buildsuite

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: buildsuite
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      SEED_DEMO: ${SEED_DEMO:-1}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  # scheduled checks: reminders, escalations, expiry, on-hold resume (backend/app/worker.py)
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: buildsuite
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads:
